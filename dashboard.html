<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnubiTec · Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b14;
            --bg-soft: #12121f;
            --card: #161625;
            --card-2: #1d1d30;
            --border: #26263a;
            --text: #e8e8f0;
            --text-2: #9b9bb4;
            --muted: #5c5c78;
            --accent: #8b5cf6;
            --accent-2: #a78bfa;
            --accent-3: #6366f1;
            --neon: #a855f7;
            --glow: rgba(139, 92, 246, 0.35);
            --glow-strong: rgba(168, 85, 247, 0.55);
            --success: #34d399;
            --success-soft: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-soft: rgba(248, 113, 113, 0.12);
            --accent-soft: rgba(139, 92, 246, 0.14);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* Preloader */
        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #preloader.hidden { opacity: 0; visibility: hidden; }

        .preloader-mark {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: preload-pulse 1.1s ease-in-out infinite;
        }

        .preloader-mark svg { width: 34px; height: 34px; color: white; }

        @keyframes preload-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 28px var(--glow); }
            50% { transform: scale(1.09); box-shadow: 0 0 52px var(--glow-strong); }
        }

        .preloader-name {
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 12px;
            color: var(--text-2);
            animation: preload-blink 1.1s ease-in-out infinite;
        }

        @keyframes preload-blink { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

        /* Sidebar */
        .sidebar {
            width: 248px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            background: var(--bg-soft);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 22px 16px;
            gap: 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 8px 22px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 22px var(--glow);
        }

        .logo svg { width: 22px; height: 22px; color: white; }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #fff, var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0 10px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-2);
            text-decoration: none;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
            font-family: inherit;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

        .nav-item:hover { color: var(--text); background: var(--card); }

        .nav-item.active {
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            box-shadow: 0 8px 24px -10px var(--glow-strong);
        }

        .sidebar-user {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 0 16px -4px var(--glow);
        }

        .user-info { flex: 1; min-width: 0; }

        .user-info .name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-info .sub {
            font-size: 11px;
            color: var(--muted);
        }

        /* Main */
        .main {
            flex: 1;
            padding: 28px 36px 40px;
            overflow-y: auto;
            position: relative;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35; }
        .orb-1 { width: 400px; height: 400px; background: var(--accent); top: -160px; right: -120px; }
        .orb-2 { width: 320px; height: 320px; background: var(--accent-3); bottom: -140px; left: 10%; opacity: 0.25; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .topbar .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse-dot 1.6s ease-in-out infinite;
        }

        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 14px 34px -16px rgba(139, 92, 246, 0.35);
        }

        .stat-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-soft);
            color: var(--accent-2);
        }

        .stat-icon svg { width: 20px; height: 20px; }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stat-value {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            word-break: break-word;
        }

        .stat-value.green { color: var(--success); }

        .panel {
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .panel h2 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel h2 svg { width: 18px; height: 18px; color: var(--accent-2); }

        .activity-list { display: flex; flex-direction: column; gap: 0; }

        .activity-item {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .activity-item:last-child { border-bottom: none; padding-bottom: 0; }

        .activity-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
            background: var(--accent);
            box-shadow: 0 0 12px -2px var(--glow);
        }

        .activity-dot.green { background: var(--success); box-shadow: 0 0 12px -2px var(--success); }

        .activity-text { flex: 1; font-size: 14px; color: var(--text-2); line-height: 1.5; }

        .activity-text strong { color: var(--text); font-weight: 600; }

        .activity-time { font-size: 12px; color: var(--muted); white-space: nowrap; }

        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 26px;
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--error);
            border: 1.5px solid rgba(248, 113, 113, 0.35);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .logout-btn:hover {
            background: var(--error-soft);
            box-shadow: 0 8px 24px -12px rgba(248, 113, 113, 0.5);
        }

        .logout-btn svg { width: 16px; height: 16px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                flex-direction: row;
                align-items: center;
                padding: 14px 16px;
                gap: 12px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .brand { padding: 0; }
            .nav { display: none; }
            .sidebar-user { border-top: none; padding-top: 0; margin-left: auto; }
            .main { padding: 20px 16px 30px; }
            .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>
    <div id="preloader">
        <div class="preloader-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </div>
        <p class="preloader-name">AnubiTec</p>
    </div>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <aside class="sidebar">
        <div class="brand">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M2 12h20"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
            </div>
            <span class="brand-name">AnubiTec</span>
        </div>

        <nav class="nav">
            <p class="nav-label">Menú</p>
            <a class="nav-item active" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                Inicio
            </a>
            <a class="nav-item" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Perfil
            </a>
            <a class="nav-item" href="#">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                Ajustes
            </a>
        </nav>

        <div class="sidebar-user">
            <div class="avatar" id="avatar">?</div>
            <div class="user-info">
                <div class="name" id="userEmail">—</div>
                <div class="sub">Conectado</div>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1 id="welcome">Bienvenido</h1>
            <span class="status-badge">
                <span class="dot"></span>
                Sesión activa
            </span>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-head">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                    </div>
                    <span class="stat-label">Estado</span>
                </div>
                <div class="stat-value green">Verificado</div>
            </div>

            <div class="stat-card">
                <div class="stat-head">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </div>
                    <span class="stat-label">Correo</span>
                </div>
                <div class="stat-value" id="emailDisplay">—</div>
            </div>

            <div class="stat-card">
                <div class="stat-head">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <span class="stat-label">Sesión</span>
                </div>
                <div class="stat-value" id="sessionTime">—</div>
            </div>
        </section>

        <section class="panel">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
                    <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                </svg>
                Actividad reciente
            </h2>
            <div class="activity-list">
                <div class="activity-item">
                    <span class="activity-dot green"></span>
                    <span class="activity-text">Sesión iniciada con <strong id="actEmail">tu cuenta</strong></span>
                    <span class="activity-time" id="actTime">Ahora</span>
                </div>
                <div class="activity-item">
                    <span class="activity-dot"></span>
                    <span class="activity-text">Cuenta verificada correctamente</span>
                    <span class="activity-time">Verificado</span>
                </div>
                <div class="activity-item">
                    <span class="activity-dot"></span>
                    <span class="activity-text">Registro completado en <strong>AnubiTec</strong></span>
                    <span class="activity-time">Registro</span>
                </div>
            </div>
        </section>

        <button class="logout-btn" id="logoutBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Cerrar Sesión
        </button>
    </main>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const p = document.getElementById('preloader');
                p.classList.add('hidden');
                setTimeout(() => p.remove(), 600);
            }, 1500);
        });

        const user = sessionStorage.getItem('user');
        if (user) {
            const name = user.replace(/@.*/, '');
            const initial = name.charAt(0).toUpperCase();
            document.getElementById('welcome').textContent = 'Bienvenido, ' + name;
            document.getElementById('avatar').textContent = initial;
            document.getElementById('userEmail').textContent = user;
            document.getElementById('emailDisplay').textContent = user;
            document.getElementById('actEmail').textContent = user;
            const t = new Date();
            const timeStr = t.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('sessionTime').textContent = 'Hoy ' + timeStr;
        } else {
            location.replace('/');
        }

        history.pushState(null, '', location.href);
        window.addEventListener('popstate', () => {
            history.pushState(null, '', location.href);
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch('/logout', { method: 'POST' });
            } catch (err) {}
            sessionStorage.removeItem('user');
            location.replace('/');
        });
    </script>
</body>
</html>
