<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnubiTec · Crear Cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b14;
            --bg-soft: #12121f;
            --card: #161625;
            --card-2: #1d1d30;
            --border: #26263a;
            --text: #e8e8f0;
            --text-2: #9b9bb4;
            --muted: #5c5c78;
            --accent: #8b5cf6;
            --accent-2: #a78bfa;
            --accent-3: #6366f1;
            --neon: #a855f7;
            --glow: rgba(139, 92, 246, 0.35);
            --glow-strong: rgba(168, 85, 247, 0.55);
            --success: #34d399;
            --success-soft: rgba(52, 211, 153, 0.12);
            --error: #f87171;
            --error-soft: rgba(248, 113, 113, 0.12);
            --accent-soft: rgba(139, 92, 246, 0.14);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
        }

        .orb-1 { width: 420px; height: 420px; background: var(--accent); top: -140px; left: -120px; }
        .orb-2 { width: 380px; height: 380px; background: var(--accent-3); bottom: -160px; right: -100px; }
        .orb-3 { width: 220px; height: 220px; background: var(--neon); top: 40%; right: 12%; opacity: 0.25; }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(139, 92, 246, 0.05) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 34px var(--glow), 0 12px 30px rgba(139, 92, 246, 0.35);
            transition: transform 0.25s ease;
        }

        .logo:hover { transform: translateY(-2px); }

        .logo svg { width: 30px; height: 30px; color: white; }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #fff, var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--text-2);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .card {
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(139, 92, 246, 0.06), 0 0 44px -18px var(--glow);
            backdrop-filter: blur(12px);
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .input-wrap .icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            display: flex;
            transition: color 0.2s;
        }

        .input-wrap:focus-within .icon { color: var(--accent-2); }

        .input-wrap input {
            width: 100%;
            padding: 13px 44px 13px 42px;
            background: var(--bg-soft);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .input-wrap input::placeholder { color: var(--muted); }

        .input-wrap input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft), 0 0 18px -6px var(--glow);
            background: var(--bg);
        }

        .input-wrap.error input {
            border-color: var(--error);
            box-shadow: 0 0 0 3px var(--error-soft);
        }

        .input-wrap.valid input {
            border-color: var(--success);
            box-shadow: 0 0 0 3px var(--success-soft);
        }

        .field-error {
            display: none;
            margin-top: 7px;
            font-size: 12px;
            color: var(--error);
            line-height: 1.3;
        }

        .field-error.show {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            color: var(--muted);
            padding: 4px;
            display: flex;
            transition: color 0.2s;
        }

        .toggle-password:hover { color: var(--text); }

        .toggle-password svg { width: 18px; height: 18px; }

        .strength {
            margin-top: 8px;
            height: 5px;
            border-radius: 999px;
            background: var(--bg);
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, #f87171, #fbbf24, #34d399);
            transition: width 0.3s ease;
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        button[type="submit"]:hover {
            box-shadow: 0 10px 30px -10px var(--glow-strong), 0 0 26px -8px var(--glow);
            filter: brightness(1.08);
        }

        button[type="submit"]:active { transform: scale(0.985); }

        button[type="submit"]:disabled { opacity: 0.7; cursor: not-allowed; filter: none; box-shadow: none; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            margin-top: 18px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
        }

        .message.success {
            display: flex;
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .message.error {
            display: flex;
            background: var(--error-soft);
            color: var(--error);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }

        .message svg { width: 16px; height: 16px; flex-shrink: 0; }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted);
        }

        .footer a {
            color: var(--text-2);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover { color: var(--accent-2); }

        /* Preloader */
        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #preloader.hidden { opacity: 0; visibility: hidden; }

        .preloader-mark {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: preload-pulse 1.1s ease-in-out infinite;
        }

        .preloader-mark svg { width: 34px; height: 34px; color: white; }

        @keyframes preload-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 28px var(--glow); }
            50% { transform: scale(1.09); box-shadow: 0 0 52px var(--glow-strong); }
        }

        .preloader-name {
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 12px;
            color: var(--text-2);
            animation: preload-blink 1.1s ease-in-out infinite;
        }

        @keyframes preload-blink { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="preloader">
        <div class="preloader-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M19 8v6"/>
                <path d="M22 11h-6"/>
            </svg>
        </div>
        <p class="preloader-name">AnubiTec</p>
    </div>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="container">
        <div class="brand">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M2 12h20"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
            </div>
            <span class="brand-name">AnubiTec</span>
        </div>

        <p class="subtitle">Registrate y verificá tu correo para comenzar</p>

        <div class="card">
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
                    </div>
                    <p class="field-error" id="emailError"></p>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="strength"><div class="strength-fill" id="strengthFill"></div></div>
                    <p class="field-error" id="passwordError"></p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                        </span>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repetí la contraseña" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" id="toggleConfirm" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <p class="field-error" id="confirmError"></p>
                </div>

                <button type="submit" id="submitBtn">
                    <span class="spinner" id="spinner"></span>
                    <span id="btnText">Registrarme</span>
                </button>
            </form>

            <div id="message" class="message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="msgIcon"></svg>
                <span id="msgText"></span>
            </div>
        </div>

        <p class="footer">¿Ya tenés cuenta? <a href="/">Inicia sesión</a></p>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const p = document.getElementById('preloader');
                p.classList.add('hidden');
                setTimeout(() => p.remove(), 600);
            }, 1500);
        });

        const form = document.getElementById('registerForm');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const submitBtn = document.getElementById('submitBtn');
        const message = document.getElementById('message');
        const msgText = document.getElementById('msgText');
        const msgIcon = document.getElementById('msgIcon');

        const ICONS = {
            success: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
            error: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'
        };

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function setFieldState(input, msg) {
            const wrap = input.closest('.input-wrap');
            const errorEl = wrap.parentElement.querySelector('.field-error');
            const valid = !msg;
            wrap.classList.toggle('error', !valid);
            wrap.classList.toggle('valid', valid && input.value.trim() !== '');
            if (errorEl) {
                errorEl.classList.toggle('show', !!msg);
                if (msg) errorEl.textContent = msg;
                else errorEl.textContent = '';
            }
            return valid;
        }

        function validateEmail() {
            const v = emailInput.value.trim();
            let msg = '';
            if (!v) msg = 'El correo electrónico es obligatorio.';
            else if (!EMAIL_RE.test(v)) msg = 'Ingresá un correo electrónico válido.';
            return setFieldState(emailInput, msg);
        }

        function validatePassword() {
            const v = passwordInput.value;
            let msg = '';
            if (!v) msg = 'La contraseña es obligatoria.';
            else if (v.length < 6) msg = 'La contraseña debe tener al menos 6 caracteres.';
            return setFieldState(passwordInput, msg);
        }

        function validateConfirm() {
            const v = confirmInput.value;
            let msg = '';
            if (!v) msg = 'Confirmá tu contraseña.';
            else if (v !== passwordInput.value) msg = 'Las contraseñas no coinciden.';
            return setFieldState(confirmInput, msg);
        }

        emailInput.addEventListener('blur', validateEmail);
        passwordInput.addEventListener('blur', validatePassword);
        confirmInput.addEventListener('blur', validateConfirm);

        function toggle(target) {
            const input = document.getElementById(target);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('togglePassword').addEventListener('click', () => toggle('password'));
        document.getElementById('toggleConfirm').addEventListener('click', () => toggle('confirmPassword'));

        document.getElementById('password').addEventListener('input', (e) => {
            const v = e.target.value;
            let score = 0;
            if (v.length >= 6) score += 25;
            if (v.length >= 10) score += 25;
            if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score += 25;
            if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) score += 25;
            document.getElementById('strengthFill').style.width = score + '%';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.className = 'message';

            const okEmail = validateEmail();
            const okPassword = validatePassword();
            const okConfirm = validateConfirm();
            if (!okEmail || !okPassword || !okConfirm) {
                if (!okEmail) emailInput.focus();
                else if (!okPassword) passwordInput.focus();
                else confirmInput.focus();
                return;
            }

            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Registrando...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                message.className = 'message error';
                msgIcon.innerHTML = ICONS.error;
                msgText.textContent = 'Las contraseñas no coinciden';
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Registrarme';
                return;
            }

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    message.className = 'message success';
                    msgIcon.innerHTML = ICONS.success;
                    msgText.textContent = data.message;
                    setTimeout(() => location.replace(data.redirect), 1200);
                } else {
                    message.className = 'message error';
                    msgIcon.innerHTML = ICONS.error;
                    msgText.textContent = data.message || 'Error al registrar';
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'Registrarme';
                }
            } catch (err) {
                message.className = 'message error';
                msgIcon.innerHTML = ICONS.error;
                msgText.textContent = 'Error de conexión con el servidor';
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Registrarme';
            }
        });
    </script>
</body>
</html>
